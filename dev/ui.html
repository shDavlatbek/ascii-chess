<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UI harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #14141c; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #log { position: fixed; right: 6px; bottom: 6px; width: 250px; max-height: 40vh; overflow: hidden; margin: 0;
         font: 10px/1.25 monospace; color: #8a88b4; background: rgba(13,13,19,.7); padding: 4px; pointer-events: none; white-space: pre-wrap; }
  #help { position: fixed; left: 6px; bottom: 6px; font: 10px/1.3 monospace; color: #55557a; pointer-events: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<pre id="log"></pre>
<div id="help">harness keys: 1 title - 2 playing - 3 gameover - P promotion - T thinking - B busy - C check - L cycle result - N add move</div>
<script type="module" src="./ui-harness.js"></script>
</body>
</html>
